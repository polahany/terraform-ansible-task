---
- name: Verify that the Docker role is running on supported Ubuntu hosts
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_architecture in docker_apt_architecture_map
    fail_msg: >-
      This role supports Ubuntu on amd64, arm64, or armhf. Detected
      {{ ansible_distribution }} on {{ ansible_architecture }}.

- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: apt

- name: Remove packages that conflict with Docker Engine
  ansible.builtin.apt:
    name: >-
      {{
        docker_conflicting_packages
        | intersect(ansible_facts.packages.keys() | list)
      }}
    state: absent
    purge: false
  when: >-
    (
      docker_conflicting_packages
      | intersect(ansible_facts.packages.keys() | list)
      | length
    ) > 0

- name: Install packages required for the Docker apt repository
  ansible.builtin.apt:
    name: "{{ docker_prerequisite_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker's official apt signing key
  ansible.builtin.get_url:
    url: "{{ docker_apt_key_url }}"
    dest: "{{ docker_apt_key_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Configure Docker's official apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types:
      - deb
    uris:
      - "{{ docker_apt_repository_url }}"
    suites:
      - "{{ ansible_distribution_release }}"
    components:
      - "{{ docker_apt_release_channel }}"
    architectures:
      - "{{ docker_apt_architecture }}"
    signed_by: "{{ docker_apt_key_path }}"
    state: present
    enabled: true
  register: docker_apt_repository

- name: Update the apt cache after configuring the Docker repository
  ansible.builtin.apt:
    update_cache: true
  when: docker_apt_repository.changed

- name: Install Docker Engine and Docker Compose
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
  notify: Restart Docker

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Verify that the Docker daemon responds
  ansible.builtin.command:
    argv:
      - docker
      - info
  changed_when: false

- name: Verify that the Docker Compose plugin is available
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - version
  changed_when: false
