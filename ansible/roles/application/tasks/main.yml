---
- name: Create app directory on the server
  ansible.builtin.file:
    path: "{{ app_directory }}"
    state: directory
    mode: '0755'

- name: Create application source directory on the server
  ansible.builtin.file:
    path: "{{ app_source_directory }}"
    state: directory
    mode: '0755'

- name: Copy application build files to the server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/{{ item }}"
    dest: "{{ app_directory }}/{{ item }}"
    mode: '0644'
  loop: "{{ app_build_files }}"

- name: Copy application source files to the server
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ app_source_directory }}/"
    mode: '0644'
  with_fileglob:
    - "{{ playbook_dir }}/../app/src/*"

- name: Build the application Docker image
  community.docker.docker_image:
    name: "{{ app_image }}"
    build:
      path: "{{ app_directory }}"
    source: build
    force_source: true

- name: Deploy docker-compose for the application
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ app_compose_file }}"
    mode: '0644'

- name: Start the application container
  community.docker.docker_compose_v2:
    project_src: "{{ app_directory }}"
    state: present

- name: Initialize the application database schema
  community.docker.docker_container_exec:
    container: "{{ app_container_name }}"
    argv:
      - python
      - -m
      - flask
      - --app
      - src.app:create_app
      - init-db
  changed_when: false

- name: Wait for the application to become healthy
  community.docker.docker_compose_v2:
    project_src: "{{ app_directory }}"
    state: present
    wait: true
    wait_timeout: "{{ app_compose_wait_timeout }}"
